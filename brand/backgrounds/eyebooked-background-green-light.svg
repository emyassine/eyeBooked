<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
<title id="title">EyeBooked light page background</title><desc id="desc">Static 2K export of the original page gradient and softly blurred aurora.</desc>
<defs><linearGradient id="base" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#DDF3E8"/><stop offset=".5" stop-color="#F3FAF6"/><stop offset="1" stop-color="#E1F2E9"/></linearGradient><radialGradient id="glow1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2FA37C" stop-opacity="0.5333"/><stop offset="1" stop-color="#2FA37C" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0B5D45" stop-opacity="0.4000"/><stop offset="1" stop-color="#0B5D45" stop-opacity="0"/></radialGradient><radialGradient id="glow3" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B5E3CF" stop-opacity="0.6667"/><stop offset="1" stop-color="#B5E3CF" stop-opacity="0"/></radialGradient><filter id="soften" x="-20%" y="-25%" width="140%" height="150%"><feGaussianBlur stdDeviation="60"/></filter></defs>
<rect width="2560" height="1440" fill="url(#base)"/>
